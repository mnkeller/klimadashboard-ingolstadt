    </div>
  </section>
  <section class="abschnitt">

        <div class="b8 weiss" data-modul="pv-bestand"></div>

  <section class="abschnitt">
    <div class="huelle">
      <div class="raster">
        <div class="b6 weiss" data-modul="pv-zubau"></div>
        <div class="b6 weiss" data-modul="speicher"></div>

  </section>
  <section class="abschnitt">
    <div class="huelle">
